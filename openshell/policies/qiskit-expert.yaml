# OpenShell Policy — qiskit_expert (Circuit)
#
# Princípio: least privilege. Circuit acessa apenas a API Qiskit interna e o LLM.
# Sem acesso à internet, PyPI, GitHub ou qualquer serviço externo.
#
# Schema validado contra: https://docs.nvidia.com/openshell/latest/reference/policy-schema
#
# Aplique com:
#   openshell policy set qiskit-expert --policy qiskit-expert.yaml --wait

version: 1

# ── Filesystem ─────────────────────────────────────────────────────────────
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc
    - /dev/urandom
    - /app
    - /etc/ssl
    - /etc/passwd
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort   # não falha em kernels sem Landlock completo (RHCOS)

# ── Network ────────────────────────────────────────────────────────────────
network_policies:

  # API de encoding quântico (interno ao cluster)
  qiskit_api:
    name: qiskit-agents-api
    endpoints:
      - host: llama-qiskit-agents.openclaw.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write        # GET + POST (sem DELETE/admin)
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  # Endpoint LLM (vLLM no OpenShift)
  llm_inference:
    name: vllm-inference
    endpoints:
      - host: llama-32-3b-instruct-predictor.my-first-model.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  # DNS interno do cluster
  cluster_dns:
    name: cluster-dns
    endpoints:
      - host: kube-dns.kube-system.svc.cluster.local
        port: 53
        protocol: udp
        enforcement: enforce
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/dig }

# ── Process ────────────────────────────────────────────────────────────────
# Chave correta é "process" (não "process_policy")
# Campos suportados: run_as_user, run_as_group
# Privilege escalation e execuções root são sempre bloqueados pelo runtime.
process:
  run_as_user: sandbox
