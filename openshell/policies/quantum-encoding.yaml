# OpenShell Policy — quantum_encoding (QiskitAgent)
#
# Policy geral para o agente QiskitAgent. Acesso à API Qiskit + LLM.
# Permite /tmp para uploads de CSV via /v1/compare/csv.
#
# Schema validado contra: https://docs.nvidia.com/openshell/latest/reference/policy-schema
#
# Aplique com:
#   openshell policy set quantum-encoding --policy quantum-encoding.yaml --wait

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc
    - /dev/urandom
    - /app
    - /etc/ssl
    - /etc/passwd
  read_write:
    - /sandbox
    - /tmp             # uploads de CSV passam por aqui
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:

  qiskit_api:
    name: qiskit-agents-api
    endpoints:
      - host: llama-qiskit-agents.openclaw.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  llm_inference:
    name: vllm-inference
    endpoints:
      - host: llama-32-3b-instruct-predictor.my-first-model.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  cluster_dns:
    name: cluster-dns
    endpoints:
      - host: kube-dns.kube-system.svc.cluster.local
        port: 53
        protocol: udp
        enforcement: enforce
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

process:
  run_as_user: sandbox
