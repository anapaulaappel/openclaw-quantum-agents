# OpenShell Policy — qiskit_mentor (Quanta)
#
# Quanta adiciona acesso de leitura a recursos acadêmicos externos
# (arXiv + docs Qiskit) para enriquecer explicações com referências reais.
#
# Schema validado contra: https://docs.nvidia.com/openshell/latest/reference/policy-schema
#
# Aplique com:
#   openshell policy set qiskit-mentor --policy qiskit-mentor.yaml --wait

version: 1

# ── Filesystem ─────────────────────────────────────────────────────────────
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc
    - /dev/urandom
    - /app
    - /etc/ssl
    - /etc/passwd
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

# ── Network ────────────────────────────────────────────────────────────────
network_policies:

  # API de encoding quântico (interno ao cluster)
  qiskit_api:
    name: qiskit-agents-api
    endpoints:
      - host: llama-qiskit-agents.openclaw.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  # Endpoint LLM
  llm_inference:
    name: vllm-inference
    endpoints:
      - host: llama-32-3b-instruct-predictor.my-first-model.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  # arXiv — papers de QML (somente leitura)
  arxiv_papers:
    name: arxiv-readonly
    endpoints:
      - host: arxiv.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only          # GET, HEAD, OPTIONS apenas
    binaries:
      - { path: /usr/bin/curl }

  # Documentação Qiskit (somente leitura)
  qiskit_docs:
    name: qiskit-docs-readonly
    endpoints:
      - host: docs.quantum.ibm.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/curl }

  # DNS interno
  cluster_dns:
    name: cluster-dns
    endpoints:
      - host: kube-dns.kube-system.svc.cluster.local
        port: 53
        protocol: udp
        enforcement: enforce
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

# ── Process ────────────────────────────────────────────────────────────────
process:
  run_as_user: sandbox
