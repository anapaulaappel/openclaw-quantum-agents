# =============================================================================
# ATENÇÃO: Edite este arquivo ANTES de aplicar!
# Substitua os valores entre <> pelos seus dados reais.
# Nunca versione este arquivo com dados reais em repositórios públicos.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw
  labels:
    app: openclaw
stringData:
  # Token de acesso ao gateway do OpenClaw.
  # Gere um token aleatório seguro, por exemplo:
  #   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
  OPENCLAW_GATEWAY_TOKEN: "<SEU_TOKEN_GATEWAY_AQUI>"

  # vLLM local no cluster — sem chave de API necessária.
  # O OpenClaw usa a variável OPENAI_API_KEY como placeholder obrigatório
  # mesmo quando o endpoint não requer autenticação. O valor "dummy" funciona.
  OPENAI_API_KEY: "dummy"

  # --- Telegram Bot (opcional, para canal Telegram) ---
  # TELEGRAM_BOT_TOKEN: "<token-do-seu-bot-telegram>"
