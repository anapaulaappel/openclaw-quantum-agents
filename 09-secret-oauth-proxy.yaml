# Secret para o cookie do oauth-proxy.
# Gere um valor aleatório com:
#   python3 -c "import secrets; print(secrets.token_hex(16))"
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-oauth-proxy-secret
  namespace: openclaw
  labels:
    app: openclaw
stringData:
  session_secret: "<GERE_UM_VALOR_ALEATORIO_AQUI>"
