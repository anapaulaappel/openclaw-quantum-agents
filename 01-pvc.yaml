apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-home-pvc
  namespace: openclaw
  labels:
    app: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # IMPORTANTE: Não use NFS. Use block storage como gp3-csi (AWS), managed-csi (Azure)
  # ou thin-csi (vSphere). Comente a linha abaixo se quiser usar o storageClass padrão
  # do seu cluster. Se precisar especificar um, descomente e ajuste:
  # storageClassName: gp3-csi
