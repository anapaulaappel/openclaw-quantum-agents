# ServiceAccount necessária para o oauth-proxy funcionar no OpenShift.
# O OpenShift usa OAuth nativo para autenticar usuários — sem precisar
# de provedor de identidade externo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-sa
  namespace: openclaw
  annotations:
    # Permite que o oauth-proxy redirecione para a rota do OpenShift
    serviceaccounts.openshift.io/oauth-redirectreference.openclaw: >
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"openclaw"}}
  labels:
    app: openclaw
